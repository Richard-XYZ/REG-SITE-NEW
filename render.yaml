# Render.com service configuration for automated deployments.
# Replace USERNAME/REPO and any placeholder values before committing.

services:
  - type: web
    name: sec4future
    env: static
    repo: https://github.com/Richard-XYZ/REG-SITE-NEW.git
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Instance and scaling
    plan: hobby
    numInstances: 1
    region: oregon
    # Build & start steps for automated deployment
    buildCommand:
    startCommand:
    # Health check and auto-deploy on repo changes
    healthCheckPath: /
    autoDeploy: true
    # Environment variables (use secure: true for secrets)
    # envVars:
    #   - key: NODE_ENV
    #     value: production
    #   - key: PORT
    #     value: "10000"
    # - key: DATABASE_URL
    #   value: "postgres://user:pass@host:5432/db" # replace or convert to secure secret
    #   secure: false

  - type: 
    name: sec4future
    repo: https://github.com/Richard-XYZ/REG-SITE-NEW.git
    branch: main
    env: static
    staticPublishPath: .
